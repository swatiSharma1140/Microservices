spring.application.name=QuizService
server.port=${PORT:8081}
spring.datasource.url=jdbc:mysql://localhost:3306/micro_yt
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=https://microservices-a25m.onrender.com/eureka/
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=10
eureka.client.disable-delta=true
