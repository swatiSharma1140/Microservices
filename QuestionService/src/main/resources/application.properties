spring.application.name=QuestionService
server.port=${PORT:8082}
spring.datasource.url=jdbc:mysql://microservices-db-swatisharma64135-4fae.b.aivencloud.com:17280/defaultdb?sslMode=REQUIRED
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
eureka.client.service-url.defaultZone=https://microservices-a25m.onrender.com/eureka/
